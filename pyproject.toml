[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "eleviewer"
version = "1.3.1"
description = "Lightweight Document Viewer & Study Workspace"
requires-python = ">=3.11"

[tool.maturin]
manifest-path = "eleviewer-native/Cargo.toml"
module-name = "eleviewer_native"


[tool.pytest.ini_options]
norecursedirs = ["agentic-awesome-skills"]
testpaths = ["tests"]
pythonpath = ["."]

