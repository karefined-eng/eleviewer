name: EleViewer Release Pipeline

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build-and-sign:
    runs-on: windows-latest
    permissions:
      id-token: write # Required for Azure Trusted Signing
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka ordered-set zstandard

      - name: Extract Version from Tag
        id: version
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag -replace '^v', ''
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT
          echo "TAG=$tag" >> $env:GITHUB_OUTPUT

      - name: Install Dependency Walker for Nuitka
        shell: pwsh
        run: |
          $cacheDir = Join-Path $env:USERPROFILE "AppData\Local\Nuitka\Nuitka\Cache\downloads\depends\x86_64"
          $zipPath = Join-Path $env:RUNNER_TEMP "depends22_x64.zip"
          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null
          Invoke-WebRequest -Uri "https://dependencywalker.com/depends22_x64.zip" -OutFile $zipPath
          $extractDir = Join-Path $env:RUNNER_TEMP "depends22_x64"
          if (Test-Path $extractDir) { Remove-Item -Recurse -Force $extractDir }
          Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force
          $depends = Get-ChildItem -Path $extractDir -Recurse -Filter "depends.exe" | Select-Object -First 1
          if (-not $depends) { throw "Dependency Walker executable was not found in the downloaded archive." }
          Copy-Item $depends.FullName (Join-Path $cacheDir "depends.exe") -Force
          Write-Output "Installed Dependency Walker at $(Join-Path $cacheDir 'depends.exe')"

      - name: Compile with Nuitka (Native C++ with LTO)
        run: |
          python -m nuitka `
            --standalone `
            --lto=yes `
            --enable-plugin=pyside6 `
            --include-qt-plugins=sensible,styles `
            --windows-icon-from-ico=icons/eleviewer.ico `
            --windows-company-name="karefined-eng" `
            --windows-product-name="EleViewer" `
            --windows-file-version="${{ steps.version.outputs.VERSION }}.0" `
            --windows-product-version="${{ steps.version.outputs.VERSION }}.0" `
            --windows-file-description="Lightweight Document Viewer & Study Workspace" `
            --include-data-dir=icons=icons `
            --include-data-dir=getting_started=getting_started `
            --disable-console `
            --output-filename=EleViewer.exe `
            main.py

      - name: Install Inno Setup
        run: |
          choco install innosetup

      - name: Compile Inno Setup Installer
        run: |
          # Copy Nuitka standalone distribution to dist/
          mkdir dist
          cp main.dist/EleViewer.exe dist/
          
          # Compile setup.iss with dynamic version from git tag
          iscc /DAppVersion=${{ steps.version.outputs.VERSION }} setup.iss

      - name: Verify release assets
        run: |
          if (-not (Test-Path "dist/EleViewer.exe")) {
            throw "Expected portable executable was not produced."
          }
          if (-not (Test-Path "dist/EleViewer_Setup_v${{ steps.version.outputs.VERSION }}.exe")) {
            throw "Expected installer was not produced."
          }
          Get-ChildItem dist

      - name: Generate Winget installer manifest
        shell: pwsh
        run: |
          $installerPath = "dist/EleViewer_Setup_v${{ steps.version.outputs.VERSION }}.exe"
          $installerUrl = "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.TAG }}/EleViewer_Setup_v${{ steps.version.outputs.VERSION }}.exe"
          $installerHash = (Get-FileHash $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifestPath = "dist/winget-installer.yaml"
          $content = Get-Content "winget/karefined-eng.EleViewer.installer.yaml" -Raw
          $content = $content.Replace("PackageVersion: 1.3.0", "PackageVersion: ${{ steps.version.outputs.VERSION }}")
          $content = $content.Replace("InstallerUrl: https://github.com/karefined-eng/eleviewer/releases/download/v1.3.0/EleViewer_Setup_v1.3.0.exe", "InstallerUrl: $installerUrl")
          $content = $content.Replace("InstallerSha256: E1EF2B0FB6A01D3061331297B0FF621FD70A2E8C35338148A7E75CCF777FED3A", "InstallerSha256: $installerHash")
          Set-Content -Path $manifestPath -Value $content
          Write-Output "Generated $manifestPath"
          Get-Content $manifestPath

      - name: Azure Trusted Signing (SmartScreen Bypass)
        uses: azure/trusted-signing-action@v0.5.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net/
          code-signing-account-name: karefined_signing
          certificate-profile-name: EleViewerProfile
          files-folder: dist
          files-folder-filter: "exe"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/EleViewer.exe
            dist/EleViewer_Setup_*.exe
            dist/winget-installer.yaml
          name: EleViewer ${{ steps.version.outputs.TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
